<!doctype html>
<meta charset="utf-8">
<title>삼스 864</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F6F5F1; --surface:#FFFFFF; --surface-2:#EDECE6; --ink:#191B1F; --ink-2:#565C64;
  --ink-3:#8A9098; --rule:#E0DED7; --rule-soft:#EAE8E1; --accent:#2F5DA8; --accent-soft:#E3EAF6;
  --done:#1F8A4C; --done-soft:#E2F2E8; --done-ink:#146034;
  --shaky:#B8880A; --shaky-soft:#F7EDD2; --shaky-ink:#7D5D06;
  --fail:#C9433A; --fail-soft:#F9E4E2; --fail-ink:#93302A;
  --chip-sh:0 1px 2px rgba(25,27,31,.06);
  --fU:#f2f2f0; --fL:#f4c07e; --fF:#9fd6a0; --fR:#f0a09a; --fB:#9dbdea; --fD:#f3e690;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111317; --surface:#1A1D22; --surface-2:#22262C; --ink:#E9EBEE; --ink-2:#A8AEB6;
    --ink-3:#767D86; --rule:#2C3036; --rule-soft:#24282E; --accent:#83AAE6; --accent-soft:#1E2B40;
    --done:#46B375; --done-soft:#173226; --done-ink:#8FD9AF;
    --shaky:#D9AC35; --shaky-soft:#32290F; --shaky-ink:#EACB77;
    --fail:#E0685E; --fail-soft:#3A1D1A; --fail-ink:#F0A29A;
    --chip-sh:0 1px 2px rgba(0,0,0,.35);
    --fU:#c9c9c4; --fL:#b07b32; --fF:#4f8a51; --fR:#a84a42; --fB:#4a6fa3; --fD:#b3a63c;
  }
}
:root[data-theme="dark"]{
  --paper:#111317; --surface:#1A1D22; --surface-2:#22262C; --ink:#E9EBEE; --ink-2:#A8AEB6;
  --ink-3:#767D86; --rule:#2C3036; --rule-soft:#24282E; --accent:#83AAE6; --accent-soft:#1E2B40;
  --done:#46B375; --done-soft:#173226; --done-ink:#8FD9AF;
  --shaky:#D9AC35; --shaky-soft:#32290F; --shaky-ink:#EACB77;
  --fail:#E0685E; --fail-soft:#3A1D1A; --fail-ink:#F0A29A;
  --chip-sh:0 1px 2px rgba(0,0,0,.35);
  --fU:#c9c9c4; --fL:#b07b32; --fF:#4f8a51; --fR:#a84a42; --fB:#4a6fa3; --fD:#b3a63c;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; color:inherit}
.mono{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:40; background:var(--paper);
  border-bottom:1px solid var(--rule);
}
.hd-in{max-width:1180px; margin:0 auto; padding:10px 16px 0}
.hd-top{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
.hd-title{font-weight:700; font-size:19px; letter-spacing:-.01em}
.hd-title small{font-weight:500; color:var(--ink-3); font-size:12px; margin-left:6px}
.hd-count{margin-left:auto; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.hd-main{font-weight:700; font-size:17px; font-variant-numeric:tabular-nums}
.hd-main b{color:var(--done)}
.hd-main span{color:var(--ink-3); font-weight:500; font-size:13px}
.hd-sub{color:var(--ink-3); font-size:12px; font-variant-numeric:tabular-nums}
.hd-sub b{color:var(--ink-2); font-weight:600}
.pbar{height:4px; background:var(--surface-2); border-radius:2px; overflow:hidden; margin:8px 0 0}
.pbar i{display:block; height:100%; width:0; background:var(--done); border-radius:2px; transition:width .3s}
.tabs{display:flex; gap:2px; margin-top:8px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  appearance:none; border:0; background:none; padding:8px 12px 10px; font-size:14px; font-weight:600;
  color:var(--ink-3); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;
  border-radius:6px 6px 0 0;
}
.tab .n{font-size:11px; font-weight:500; margin-left:4px; font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink-2)}
.tab:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- toolbar ---------- */
.toolbar{max-width:1180px; margin:0 auto; padding:12px 16px 4px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.seg{display:inline-flex; background:var(--surface-2); border-radius:8px; padding:2px}
.seg button{
  appearance:none; border:0; background:none; padding:5px 12px; font-size:13px; font-weight:500;
  color:var(--ink-2); border-radius:6px; cursor:pointer;
}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--chip-sh); font-weight:600}
.legend{display:flex; gap:10px; margin-left:auto; font-size:12px; color:var(--ink-3); flex-wrap:wrap}
.legend i{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:4px; vertical-align:baseline}
.legend .l1 i{background:var(--done)} .legend .l2 i{background:var(--shaky)} .legend .l3 i{background:var(--fail)}
.legend .l0 i{background:var(--surface); border:1px solid var(--rule)}

/* ---------- sections ---------- */
main{max-width:1180px; margin:0 auto; padding:4px 16px 90px}
.sec{margin-top:18px}
.sec-h{display:flex; align-items:center; gap:10px; padding:0 2px 8px}
.sec-letter{font-size:21px; font-weight:700; line-height:1}
.sec-pos{font-size:11px; color:var(--ink-3); letter-spacing:.04em}
.sec-cnt{font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.sec-cnt b{color:var(--done); font-weight:600}
.sec-h .grow{flex:1}
.sec-btn{
  appearance:none; border:1px solid var(--rule); background:var(--surface); border-radius:7px;
  padding:3px 10px; font-size:12px; font-weight:500; color:var(--ink-2); cursor:pointer;
}
.sec-btn:hover{border-color:var(--accent); color:var(--accent)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(212px,1fr)); gap:8px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}

/* ---------- chips ---------- */
.chip{
  appearance:none; text-align:left; border:1px solid var(--rule); border-left-width:4px;
  background:var(--surface); border-radius:9px; padding:8px 10px 9px; cursor:pointer;
  box-shadow:var(--chip-sh); display:flex; flex-direction:column; gap:3px; min-height:56px;
  transition:transform .06s;
}
.chip:active{transform:scale(.97)}
.chip .pr{font-size:16px; font-weight:700; letter-spacing:.02em; display:flex; align-items:baseline; gap:6px}
.chip .pr .drv{font-size:10px; font-weight:500; color:var(--ink-3); border:1px solid var(--rule); border-radius:4px; padding:0 4px}
.chip .pr .st{margin-left:auto; font-size:10px; font-weight:600; letter-spacing:.05em}
.chip .alg{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-2); line-height:1.45; word-break:break-all}
.chip .note{font-size:11px; color:var(--ink-3)}
.chip.s0{border-left-color:var(--rule)}
.chip.s1{border-left-color:var(--done); background:var(--done-soft)}
.chip.s1 .st{color:var(--done-ink)}
.chip.s1 .alg{color:var(--done-ink); opacity:.75}
.chip.s2{border-left-color:var(--shaky); background:var(--shaky-soft)}
.chip.s2 .st{color:var(--shaky-ink)}
.chip.s3{border-left-color:var(--fail); background:var(--fail-soft)}
.chip.s3 .st{color:var(--fail-ink)}
.empty-note{color:var(--ink-3); font-size:13px; padding:18px 2px}
details.alts{margin-top:2px}
details.alts summary{font-size:11px; color:var(--accent); cursor:pointer; list-style:none}
details.alts summary::before{content:"대안 공식 ▾"}
details.alts[open] summary::before{content:"대안 공식 ▴"}
details.alts div{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-2); padding:4px 0 0; word-break:break-all}
details.alts div p{margin:0 0 4px}

/* ---------- settings ---------- */
.set-wrap{display:flex; flex-direction:column; gap:26px; margin-top:20px; max-width:860px}
.set-card{background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:18px}
.set-card h2{margin:0 0 4px; font-size:16px; font-weight:700}
.set-card .desc{font-size:13px; color:var(--ink-2); margin:0 0 14px}
.preset-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.preset{
  appearance:none; border:1px solid var(--rule); background:var(--surface); border-radius:8px;
  padding:6px 14px; font-size:13px; font-weight:600; color:var(--ink-2); cursor:pointer;
}
.preset[aria-pressed="true"]{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
.net{display:grid; grid-template-columns:repeat(12,minmax(26px,34px)); gap:2px; justify-content:center; margin:6px auto; overflow-x:auto; padding:4px}
.net-outer{overflow-x:auto}
.cell{aspect-ratio:1; border-radius:4px; position:relative; border:1px solid rgba(0,0,0,.18)}
.cell input{
  position:absolute; inset:0; width:100%; height:100%; border:0; background:transparent; text-align:center;
  font-family:inherit; font-size:13px; font-weight:700; color:#1a1a1a; padding:0; border-radius:4px;
}
.cell input:focus{background:rgba(255,255,255,.65)}
.cell input::placeholder{font-size:9px; color:rgba(0,0,0,.5); font-weight:500; letter-spacing:0}
.cell.ctr{display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:rgba(0,0,0,.5)}
.cell.blank{border:0; background:none}
.cell.cn::after{content:""; position:absolute; top:2px; right:2px; width:4px; height:4px; border-radius:50%; background:rgba(0,0,0,.35)}
.net-key{font-size:11.5px; color:var(--ink-3); text-align:center; margin:2px 0 0}
.order-row{margin-bottom:14px}
.order-row label{display:block; font-size:12px; font-weight:600; color:var(--ink-2); margin-bottom:4px; letter-spacing:.03em}
.order-row .ip{display:flex; gap:6px}
.order-row input{
  flex:1; border:1px solid var(--rule); background:var(--paper); color:var(--ink); border-radius:8px;
  padding:8px 10px; font-size:14px; font-family:inherit; min-width:0;
}
.order-row .msg{font-size:12px; margin-top:4px; min-height:16px}
.order-row .msg.err{color:var(--fail)}
.order-row .msg.ok{color:var(--done)}
.btn{
  appearance:none; border:1px solid var(--rule); background:var(--surface); border-radius:8px;
  padding:7px 14px; font-size:13px; font-weight:600; color:var(--ink-2); cursor:pointer; white-space:nowrap;
}
.btn.pri{background:var(--accent); border-color:var(--accent); color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0e1116}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#0e1116}}
.btn.danger:hover{border-color:var(--fail); color:var(--fail)}
/* ---------- matrix view ---------- */
main.wide{max-width:none; padding:0 8px 40px}
.mat-wrap{overflow:auto; max-height:calc(100vh - 165px); border:1px solid var(--rule); border-radius:10px; background:var(--surface); margin-top:8px}
table.mat{border-collapse:separate; border-spacing:0; min-width:max-content}
.mat th,.mat td{border-bottom:1px solid var(--rule-soft); border-right:1px solid var(--rule-soft); padding:2px 4px; vertical-align:middle; text-align:left}
.mat thead th{position:sticky; top:0; background:var(--surface-2); z-index:3; font-size:13px; font-weight:700; text-align:center; min-width:56px; padding:3px 5px}
.th-in{display:flex; flex-direction:row; align-items:center; justify-content:center; gap:5px; line-height:1.2; white-space:nowrap}
.th-in b{font-size:14px}
.mat thead th.rh{left:0; z-index:5; font-size:9.5px; font-weight:500; color:var(--ink-3); min-width:44px; text-align:left; vertical-align:bottom}
.mat tbody th.rh{position:sticky; left:0; background:var(--surface-2); z-index:2; min-width:44px; padding:2px 6px; white-space:nowrap; font-size:13px; font-weight:700; text-align:center}
.rh-line{display:flex; align-items:center; gap:6px}
.mat tbody th.rh b{font-size:13px; font-weight:700; line-height:1.2}
.mcnt{font-size:10px; color:var(--ink-3); font-weight:500; font-variant-numeric:tabular-nums}
.mcnt b{color:var(--done); font-weight:600}
.mbulk{appearance:none; border:1px solid var(--rule); background:var(--surface); border-radius:5px; padding:0 5px; font-size:9.5px; line-height:1.7; color:var(--ink-2); cursor:pointer; font-weight:500}
.mbulk:hover{border-color:var(--accent); color:var(--accent)}
.mat td.dim{background:var(--rule-soft)}
.mcell{font-family:"IBM Plex Mono",monospace; font-size:10.5px; line-height:1.35; color:var(--ink-2); cursor:pointer; white-space:nowrap; position:relative}
.mcell:hover{outline:1px solid var(--accent); outline-offset:-1px}
.mcell.s1{background:var(--done-soft); color:var(--done-ink)}
.mcell.s2{background:var(--shaky-soft); color:var(--shaky-ink)}
.mcell.s3{background:var(--fail-soft); color:var(--fail-ink)}
.mdrv{font-size:8.5px; font-style:normal; color:var(--ink-3); font-family:"IBM Plex Sans KR",sans-serif; margin-left:3px; vertical-align:top}
.save-chip{
  position:fixed; right:14px; bottom:14px; z-index:50; background:var(--surface); border:1px solid var(--rule);
  border-radius:99px; padding:5px 13px; font-size:12px; color:var(--ink-3); box-shadow:var(--chip-sh);
  opacity:0; transition:opacity .25s; pointer-events:none;
}
.save-chip.show{opacity:1}
.banner{
  max-width:1180px; margin:10px auto 0; padding:8px 16px; font-size:12.5px; color:var(--shaky-ink);
}
.banner:empty{display:none}
/* ---------- 유도 화살표 ---------- */
main,.mat-wrap{position:relative}
svg.arrows{position:absolute; top:0; left:0; z-index:1; pointer-events:none; overflow:visible}
svg.arrows path{fill:none; stroke:#fff; stroke-width:1.6; opacity:.55; marker-start:url(#as); marker-end:url(#ah); filter:drop-shadow(0 0 1px rgba(0,0,0,.7))}
svg.arrows.focus path{opacity:.12}
svg.arrows path.on{opacity:1; stroke-width:2.4}
.chip.lin,.mcell.lin{outline:1.5px solid var(--accent); outline-offset:-1px; opacity:1}
.chip.hov,.mcell.hov{position:relative; z-index:2; outline:2.5px solid var(--accent); outline-offset:-1px}
.hub{box-shadow:inset 0 0 0 3px var(--hubc)}
@media (max-width:560px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .grid.wide{grid-template-columns:1fr}
  .chip .pr{font-size:15px}
  .hd-main{font-size:15px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important}
}
</style>

<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('appdata').textContent);
const $ = (s,el)=> (el||document).querySelector(s);
const el = (t,cls,html)=>{const e=document.createElement(t); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;};
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ---------------- state ---------------- */
const LS_KEY='sams864-state', LS_UI='sams864-ui';
const BUF_C=['C','J','M'], BUF_E=['C','I'];
const IDENT_C={}, IDENT_E={};
Object.keys(DATA.KO_C).forEach(k=>IDENT_C[k]=k); BUF_C.forEach(k=>IDENT_C[k]=k);
Object.keys(DATA.KO_E).forEach(k=>IDENT_E[k]=k); BUF_E.forEach(k=>IDENT_E[k]=k);

function defaultState(){
  return {v:1, updatedAt:0, progress:{},
    schemeMode:'ko',
    schemeC:Object.assign({},DATA.KO_C), schemeE:Object.assign({},DATA.KO_E),
    orderC:DATA.ORDER_C.slice(), orderE:DATA.ORDER_E.slice(), showRev:true};
}
let state = defaultState();
let ui = {tab:'c', filter:'all', view:'list', arrows:'hover'};
try{ const u=JSON.parse(localStorage.getItem(LS_UI)||'null'); if(u) ui=Object.assign(ui,u);}catch(e){}

function normalize(s){
  const d=defaultState();
  if(!s||typeof s!=='object') return d;
  for(const k of ['progress','schemeC','schemeE']) if(!s[k]||typeof s[k]!=='object') s[k]=d[k];
  if(!Array.isArray(s.orderC)||s.orderC.length!==d.orderC.length) s.orderC=d.orderC;
  if(!Array.isArray(s.orderE)||s.orderE.length!==d.orderE.length) s.orderE=d.orderE;
  if(!s.schemeMode) s.schemeMode='ko';
  if(typeof s.showRev!=='boolean') s.showRev=true;
  if(!s.updatedAt) s.updatedAt=0;
  s.v=1;
  return s;
}

/* ---------------- persistence ---------------- */
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function lsLoad(){ try{ return normalize(JSON.parse(localStorage.getItem(LS_KEY)||'null')); }catch(e){ return null; } }

/* data/state.json 은 최초 1회 씨앗(아티팩트에서 옮겨온 진행상황). 이후엔 브라우저 localStorage 만 쓴다. */
async function remoteLoad(){
  try{
    const r = await fetch('data/state.json', {cache:'no-store'});
    if(!r.ok) return null;
    return normalize(await r.json());
  }catch(e){ return null; }
}
function showSaved(msg){
  const c=$('#saveChip'); c.textContent=msg; c.classList.add('show');
  clearTimeout(showSaved._t); showSaved._t=setTimeout(()=>c.classList.remove('show'), 1400);
}
function scheduleSave(){
  state.updatedAt = Date.now();
  lsSave(); showSaved('이 브라우저에 저장됨');
}

/* ---------------- scheme helpers ---------------- */
function schemeC(){ return state.schemeMode==='speffz' ? IDENT_C : state.schemeC; }
function schemeE(){ return state.schemeMode==='speffz' ? IDENT_E : state.schemeE; }
const LC = id => schemeC()[id] || id;
const LE = id => schemeE()[id] || id;

/* ---------------- progress helpers ---------------- */
const ST_NAMES=['','완료','애매','안 외워짐'];
function getSt(key){ return state.progress[key]|0; }
function setSt(key,v){ if(v) state.progress[key]=v; else delete state.progress[key]; }
/* 암기용(비커뮤테이터) 판별: 대괄호 없는 공식 */
function isPlainAlg(t,p){ const db=t==='c'?DATA.corners:DATA.edges; return db[p] && db[p].indexOf('[')<0; }
/* 역공식 숨김 모드에서 감춰지는 페어: 둘째 글자가 순서상 앞이고,
   자신도 역방향도 암기용이 아닌 것 (역방향이 암기용이면 뒤집어서 유도할 수 없으므로 표시) */
function isHiddenRev(t,p){
  if(state.showRev) return false;
  const order = t==='c'?state.orderC:state.orderE;
  if(order.indexOf(p[1]) >= order.indexOf(p[0])) return false;
  return !isPlainAlg(t,p) && !isPlainAlg(t,p[1]+p[0]);
}
/* 진척 설정 + (역공식 숨김 시) 감춰진 역방향 페어 동반 처리 */
function setProgress(key,v){
  setSt(key,v);
  const t=key[0], p=key.slice(2);
  if((t==='c'||t==='e') && !state.showRev && p.length===2){
    const rp=p[1]+p[0];
    const db=t==='c'?DATA.corners:DATA.edges;
    if(db[rp] && isHiddenRev(t,rp)) setSt(t+':'+rp, v);
  }
}

/* ---------------- 유도 관계 ----------------
   "S : [A, B]" 꼴에서 셋업 S의 앞 k개 무브를 떼어낸 "S' : [A, B]"가 표에 있으면 그 공식이 부모(선행).
   k가 가장 작은 부모 하나만 잇는다. 예) 강+장 D' R UD : [R' D' R, U2] → D' 떼면 강+앙 R UD : [R' D' R, U2].
   저장된 데이터가 아니라 공식표에서 매번 계산하므로 공식을 고치면 화살표도 따라온다. */
function parseAlg(a){
  a=String(a||'').trim();
  const m=a.match(/^(.*?)\s*:\s*(\[.*\])$/);
  if(m) return {setup:m[1].trim().split(/\s+/).filter(Boolean), comm:m[2].replace(/\s+/g,' ')};
  if(/^\[.*\]$/.test(a)) return {setup:[], comm:a.replace(/\s+/g,' ')};
  return null;
}
function deriveMap(db){
  const idx={}, parsed={};
  for(const p in db){ const q=parseAlg(db[p]); if(!q) continue; parsed[p]=q; idx[q.setup.join(' ')+'|'+q.comm]=p; }
  const parent={}, children={};
  for(const p in parsed){
    const {setup,comm}=parsed[p];
    for(let k=1;k<=setup.length;k++){
      const q=idx[setup.slice(k).join(' ')+'|'+comm];
      if(q && q!==p){ parent[p]={from:q, setup:setup.slice(0,k).join(' ')}; (children[q]=children[q]||[]).push(p); break; }
    }
  }
  return {parent,children};
}
const dmCache={};
function dmFor(type){ return dmCache[type] || (dmCache[type]=deriveMap(type==='c'?DATA.corners:DATA.edges)); }
/* 호버 툴팁용 유도 과정 텍스트 (조상 사슬 + 직계 파생) */
function deriveText(type,p){
  const dm=dmFor(type), L=type==='c'?LC:LE, db=type==='c'?DATA.corners:DATA.edges;
  const name=q=>L(q[0])+L(q[1]);
  const lines=[];
  let cur=p, guard=0;
  while(dm.parent[cur] && guard++<12){ const {from,setup}=dm.parent[cur]; lines.push('← '+setup+' 셋업 + '+name(from)+'  '+db[from]); cur=from; }
  const kids=dm.children[p]||[];
  if(kids.length) lines.push('→ 파생 '+kids.length+': '+kids.map(q=>name(q)+'(+'+dm.parent[q].setup+')').join(', '));
  return lines.length ? '유도\n'+lines.join('\n') : '';
}
/* 줄기: 조상 전부 + 자손 전부 */
function lineage(type,p){
  const dm=dmFor(type), set=new Set([p]);
  let cur=p, guard=0; while(dm.parent[cur] && guard++<12){ cur=dm.parent[cur].from; set.add(cur); }
  const stack=[p]; while(stack.length){ const x=stack.pop(); for(const c of (dm.children[x]||[])){ if(!set.has(c)){ set.add(c); stack.push(c); } } }
  return set;
}
let hoverKey=null;
function arrowHost(){ return (ui.view==='matrix' && $('.mat-wrap')) || $('#main'); }
function drawArrows(){
  const host=arrowHost(); if(!host) return;
  host.querySelectorAll('svg.arrows').forEach(x=>x.remove());
  host.querySelectorAll('.hub').forEach(x=>{ x.classList.remove('hub'); x.style.removeProperty('--hubc'); });
  const mode=ui.arrows||'hover', type=ui.tab;
  if(mode==='off' || !(type==='c'||type==='e')) return;
  const dm=dmFor(type);
  const els={};
  host.querySelectorAll('[data-key]').forEach(e=>{ if(e.dataset.key[0]===type && e.offsetParent!==null) els[e.dataset.key.slice(2)]=e; });
  let pairs=Object.keys(els);
  if(mode==='hover'){
    if(!hoverKey || hoverKey[0]!==type) return;
    const set=lineage(type, hoverKey.slice(2)); pairs=pairs.filter(p=>set.has(p));
  }
  const hr=host.getBoundingClientRect(), sx=host.scrollLeft, sy=host.scrollTop;
  const box=e=>{ const r=e.getBoundingClientRect(); return {cx:r.left-hr.left+sx+r.width/2, cy:r.top-hr.top+sy+r.height/2, w:r.width, h:r.height}; };
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg'); svg.setAttribute('class','arrows');
  svg.setAttribute('width',host.scrollWidth); svg.setAttribute('height',host.scrollHeight);
  svg.innerHTML='<defs><marker id="as" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#fff"/></marker>'
    +'<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" fill="#fff"/></marker></defs>';
  const inSet = hoverKey && hoverKey[0]===type ? lineage(type, hoverKey.slice(2)) : null;
  markLineage(host, els, inSet);
  const deg={};
  for(const p of pairs){
    const pr=dm.parent[p]; if(!pr || !els[pr.from] || !els[p]) continue;
    deg[pr.from]=(deg[pr.from]||0)+1; deg[p]=(deg[p]||0)+1;
    const a=box(els[pr.from]), b=box(els[p]);
    const dx=b.cx-a.cx, dy=b.cy-a.cy;
    let x1,y1,x2,y2,c1x,c1y,c2x,c2y;
    const gapX=Math.abs(dx)-(a.w+b.w)/2, gapY=Math.abs(dy)-(a.h+b.h)/2;
    if(gapX<16 && gapY<16){ /* 맞닿은 칸: 같은 쪽 면에서 나가 갈고리로 돌아 들어온다 (짧은 직선은 테두리에 가려짐) */
      if(Math.abs(dy)>=Math.abs(dx)){ /* 위아래 이웃 → 옆면 갈고리, 오른쪽에 자리 없으면 왼쪽 */
        const sg = Math.max(a.cx+a.w/2, b.cx+b.w/2)+48 < host.scrollWidth ? 1 : -1;
        x1=a.cx+sg*a.w/2; y1=a.cy; x2=b.cx+sg*b.w/2; y2=b.cy;
        const bulge=Math.max(30, Math.abs(dy)*0.9+12);
        c1x=x1+sg*bulge; c1y=y1; c2x=x2+sg*bulge; c2y=y2;
      }else{ /* 좌우 이웃 → 윗면 아치, 맨 윗줄(머리글에 가림)이면 아랫면 아치 */
        const bulge=Math.max(26, Math.abs(dx)*0.6);
        const up = a.cy-a.h/2-bulge > 4 ? -1 : 1;
        x1=a.cx; y1=a.cy+up*a.h/2; x2=b.cx; y2=b.cy+up*b.h/2;
        c1x=x1; c1y=y1+up*bulge; c2x=x2; c2y=y2+up*bulge;
      }
    }else if(gapX>=gapY){ /* 좌우: 옆면에서 나가 옆면으로, 수평 접선 */
      const sg=dx>=0?1:-1;
      x1=a.cx+sg*a.w/2; y1=a.cy; x2=b.cx-sg*b.w/2; y2=b.cy;
      const h=Math.max(24, Math.abs(x2-x1)/2);
      c1x=x1+sg*h; c1y=y1; c2x=x2-sg*h; c2y=y2;
    }else{ /* 상하: 위아래면에서, 수직 접선 */
      const sg=dy>=0?1:-1;
      x1=a.cx; y1=a.cy+sg*a.h/2; x2=b.cx; y2=b.cy-sg*b.h/2;
      const v=Math.max(24, Math.abs(y2-y1)/2);
      c1x=x1; c1y=y1+sg*v; c2x=x2; c2y=y2-sg*v;
    }
    const path=document.createElementNS(NS,'path');
    path.setAttribute('d','M'+x1.toFixed(1)+' '+y1.toFixed(1)+' C'+c1x.toFixed(1)+' '+c1y.toFixed(1)+' '+c2x.toFixed(1)+' '+c2y.toFixed(1)+' '+x2.toFixed(1)+' '+y2.toFixed(1));
    path.dataset.from=pr.from; path.dataset.to=p;
    if(inSet && inSet.has(p) && inSet.has(pr.from)) path.classList.add('on');
    svg.appendChild(path);
  }
  if(inSet && mode==='all') svg.classList.add('focus');
  if(mode==='all') for(const p in deg){ if(deg[p]>1){ els[p].classList.add('hub'); els[p].style.setProperty('--hubc','color-mix(in srgb, var(--accent) '+Math.min(85, 10+deg[p]*15)+'%, transparent)'); } }
  host.insertBefore(svg, host.firstChild);
}

function markLineage(host, els, set){

/* ---------------- pair chips (corner / edge) ---------------- */
function pairsFor(type, first){
  const order = type==='c' ? state.orderC : state.orderE;
  const same = type==='c' ? DATA.CPIECE : DATA.EPIECE;
  const out=[];
  for(const second of order){
    if(second===first) continue;
    const sp = same[first];
    if(Array.isArray(sp) ? sp.includes(second) : sp===second) continue;
    out.push(first+second);
  }
  return out;
}
function visible(st){
  if(ui.filter==='hide-done') return st!==1;
  if(ui.filter==='review') return st===2||st===3;

}

const NET_LAYOUT=(function(){
  // 12x9 grid; each entry: [row,col,face,kind,id]  kind: c=corner e=edge ctr=center buf=buffer
  const faces={
    U:{r:0,c:3,cells:[['c','A'],['e','A'],['c','B'],['e','D'],['ctr','U'],['e','B'],['c','D'],['ebuf','C'],['cbuf','C']]},
    L:{r:3,c:0,cells:[['c','E'],['e','E'],['c','F'],['e','H'],['ctr','L'],['e','F'],['c','H'],['e','G'],['c','G']]},
    F:{r:3,c:3,cells:[['c','I'],['ebuf','I'],['cbuf','J'],['e','L'],['ctr','F'],['e','J'],['c','L'],['e','K'],['c','K']]},
    R:{r:3,c:6,cells:[['cbuf','M'],['e','M'],['c','N'],['e','P'],['ctr','R'],['e','N'],['c','P'],['e','O'],['c','O']]},
    B:{r:3,c:9,cells:[['c','Q'],['e','Q'],['c','R'],['e','T'],['ctr','B'],['e','R'],['c','T'],['e','S'],['c','S']]},
    D:{r:6,c:3,cells:[['c','U'],['e','U'],['c','V'],['e','X'],['ctr','D'],['e','V'],['c','X'],['e','W'],['c','W']]}
  };
  const out=[];
  for(const f in faces){
    const {r,c,cells}=faces[f];
    cells.forEach((cell,i)=>{ out.push([r+Math.floor(i/3), c+i%3, f, cell[0], cell[1]]); });
  }
  return out;
})();

function renderSettings(){
  const main=$('#main'); main.innerHTML='';
  const wrap=el('div','set-wrap');

  /* scheme card */
  const sc=el('div','set-card');
  sc.innerHTML='<h2>레터링 스킴</h2><p class="desc">전개도의 글자를 직접 수정할 수 있습니다. 수정하면 공식표의 페어 이름이 바로 바뀝니다. 코너 칸은 오른쪽 위에 점(·)이 있습니다. \'버퍼\'로 표시된 5칸(UF 2칸·UFR 3칸)도 글자를 넣을 수 있고 — Speffz에서는 엣지 C·I, 코너 C·J·M이 여기에 할당됩니다 — 비워두면 버퍼로만 표시됩니다.</p>';
  const pr=el('div','preset-row');
  const bKo=el('button','preset','내 한글 체계'); bKo.setAttribute('aria-pressed', state.schemeMode==='ko'?'true':'false');
  const bSp=el('button','preset','Speffz'); bSp.setAttribute('aria-pressed', state.schemeMode==='speffz'?'true':'false');
  const bCu=el('button','preset','커스텀'); bCu.setAttribute('aria-pressed', state.schemeMode==='custom'?'true':'false'); bCu.style.pointerEvents='none';
  bKo.onclick=()=>{ state.schemeMode='ko'; state.schemeC=Object.assign({},DATA.KO_C); state.schemeE=Object.assign({},DATA.KO_E); scheduleSave(); renderSettings(); };
  bSp.onclick=()=>{ state.schemeMode='speffz'; scheduleSave(); renderSettings(); };
  pr.append(bKo,bSp,bCu);
  sc.appendChild(pr);
  const netOuter=el('div','net-outer');
  const net=el('div','net');
  const FCOLOR={U:'var(--fU)',L:'var(--fL)',F:'var(--fF)',R:'var(--fR)',B:'var(--fB)',D:'var(--fD)'};
  const cellsByPos={};
  for(const [r,c,f,kind,id] of NET_LAYOUT){
    const d=el('div','cell');
    d.style.gridRow=r+1; d.style.gridColumn=c+1;
    d.style.background=FCOLOR[f];
    if(kind==='ctr'){ d.classList.add('ctr'); d.textContent=f; }
    else{
      const isCorner = kind==='c'||kind==='cbuf';
      const isBuf = kind==='cbuf'||kind==='ebuf';
      if(isCorner) d.classList.add('cn');
      const inp=document.createElement('input');
      inp.maxLength=4;
      const cur = isCorner ? schemeC()[id] : schemeE()[id];
      inp.value = cur || '';
      if(isBuf) inp.placeholder='버퍼';
      inp.setAttribute('aria-label',(isCorner?'코너 ':'엣지 ')+(isCorner?DATA.POS_C[id]:DATA.POS_E[id])+(isBuf?' (버퍼)':''));
      inp.onchange=()=>{
        const v=inp.value.trim();
        if(!v && !isBuf){ inp.value = cur || ''; return; }
        if(state.schemeMode==='speffz'){ state.schemeC=Object.assign({},IDENT_C); state.schemeE=Object.assign({},IDENT_E); }
        state.schemeMode='custom';
        const target = isCorner ? state.schemeC : state.schemeE;
        if(v) target[id]=v; else delete target[id];
        scheduleSave(); renderSettings();
      };
      d.appendChild(inp);
      cellsByPos[kind+id]=inp;
    }
    net.appendChild(d);
  }
  netOuter.appendChild(net);
  sc.appendChild(netOuter);
  sc.appendChild(el('p','net-key','흰(U)·초(F) 기준 전개도 — 점(·) 있는 칸 = 코너 스티커, 없는 칸 = 엣지 스티커'));
  // duplicate warning
  const dupMsg=el('p','net-key');
  (function(){
    const seenC={}, seenE={}, dups=new Set();
    for(const id in schemeC()){ const v=schemeC()[id]; if(!v) continue; if(seenC[v])dups.add(v); seenC[v]=1; }
    for(const id in schemeE()){ const v=schemeE()[id]; if(!v) continue; if(seenE[v])dups.add(v); seenE[v]=1; }
    if(dups.size){ dupMsg.textContent='⚠ 중복 글자: '+[...dups].join(', '); dupMsg.style.color='var(--fail)'; }
  })();
  sc.appendChild(dupMsg);
  wrap.appendChild(sc);

  /* order card */
  const oc=el('div','set-card');
  oc.innerHTML='<h2>나열 순서</h2><p class="desc">공식표에서 첫 글자 줄과 줄 안의 둘째 글자가 나열되는 순서입니다. 글자를 공백으로 구분해 원하는 순서로 고친 뒤 적용을 누르세요.</p>';
  function orderRow(labelTxt, type){
    const row=el('div','order-row');
    row.innerHTML='<label>'+labelTxt+'</label>';
    const ipWrap=el('div','ip');
    const inp=document.createElement('input');
    const cur = type==='c'?state.orderC:state.orderE;
    const L = type==='c'?LC:LE;
    inp.value=cur.map(L).join(' ');
    const apply=el('button','btn pri','적용');
    const reset=el('button','btn','시트 순서');
    const msg=el('div','msg');
    apply.onclick=()=>{
      const toks=inp.value.trim().split(/[\s,·]+/).filter(Boolean);
      const scheme = type==='c'?schemeC():schemeE();
      const baseIds = type==='c'?DATA.ORDER_C:DATA.ORDER_E;
      const rev={}; for(const id of baseIds){ if(scheme[id]) rev[scheme[id]]=id; }
      const ids=[]; const bad=[];
      for(const t of toks){ if(rev[t]!=null) ids.push(rev[t]); else bad.push(t); }
      const need = baseIds.length;
      const uniq=new Set(ids);
      if(bad.length){ msg.textContent='알 수 없는 글자: '+bad.join(', '); msg.className='msg err'; return; }
      if(uniq.size!==need || ids.length!==need){ msg.textContent='글자 '+need+'개가 정확히 한 번씩 필요합니다 (현재 '+uniq.size+'개).'; msg.className='msg err'; return; }
      if(type==='c') state.orderC=ids; else state.orderE=ids;
      msg.textContent='적용됨'; msg.className='msg ok';
      scheduleSave();
    };
    reset.onclick=()=>{
      if(type==='c') state.orderC=DATA.ORDER_C.slice(); else state.orderE=DATA.ORDER_E.slice();
      inp.value=(type==='c'?state.orderC:state.orderE).map(L).join(' ');
      msg.textContent='시트 순서로 되돌림'; msg.className='msg ok';
      scheduleSave();
    };
    ipWrap.append(inp,apply,reset);
    row.appendChild(ipWrap); row.appendChild(msg);
    return row;
  }
  oc.appendChild(orderRow('코너 (21글자)','c'));
  oc.appendChild(orderRow('엣지 (22글자)','e'));
  wrap.appendChild(oc);

  /* data card */
  const dc=el('div','set-card');
  dc.innerHTML='<h2>데이터</h2><p class="desc">진행상황은 이 브라우저(localStorage)에만 자동 저장됩니다. 다른 기기에서 쓰려면 파일로 저장해 옮기세요. 공식 위에 마우스를 올리면 유도 과정(셋업 몇 회전으로 어느 공식에서 왔는지)이 보이고, 툴바의 화살표 모드로 원본→파생 관계를 그려 볼 수 있습니다. 표기 공식 중 <span class="drv" style="border:1px solid var(--rule);border-radius:4px;padding:0 4px;font-size:11px">역</span> 표시는 시트에 없는 방향이라 반대 방향 공식에서 자동 유도(커뮤테이터 순서 교환)한 것입니다.</p>';
  const btns=el('div','preset-row');
  const ex=el('button','btn','진행상황 파일로 저장');
  ex.onclick=()=>{
    const name='sams864_'+(new Date().toISOString().slice(0,10).replace(/-/g,''))+'.json';
    const data=JSON.stringify(state);
    try{
      const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));
      const a=document.createElement('a');
      a.href=url; a.download=name; a.style.display='none';
      document.body.appendChild(a); a.click();
      setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1000);
      showSaved(name+' 저장');
    }catch(e){ ex.textContent='저장 실패'; }
  };
  const imp=el('button','btn','진행상황 파일 불러오기');
  const fi=document.createElement('input');
  fi.type='file'; fi.accept='.json,application/json'; fi.style.display='none';
  fi.onchange=e=>{
    const f=e.target.files[0]; e.target.value='';
    if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const inc=normalize(JSON.parse(String(r.result)));
        if(!inc||typeof inc.progress!=='object') throw new Error('bad');
        state=inc; scheduleSave();
        renderTabs(); syncFilterSeg(); syncViewSeg(); renderCounts(); renderMain();
        showSaved('진행상황 '+Object.keys(inc.progress).length+'개 불러옴');
      }catch(err){ imp.textContent='불러오기 실패 — JSON 확인'; setTimeout(()=>imp.textContent='진행상황 파일 불러오기',2500); }
    };
    r.readAsText(f);
  };
  imp.onclick=()=>fi.click();
  const cp=el('button','btn','JSON 복사');
  cp.onclick=async()=>{ try{ await navigator.clipboard.writeText(JSON.stringify(state)); cp.textContent='복사됨 ✓'; setTimeout(()=>cp.textContent='JSON 복사',1500);}catch(e){ cp.textContent='복사 실패'; } };
  const rs=el('button','btn danger','진행상황 전체 초기화');
  let armed=false;
  rs.onclick=()=>{
    if(!armed){ armed=true; rs.textContent='정말 초기화할까요? 한 번 더 누르면 삭제'; setTimeout(()=>{armed=false; rs.textContent='진행상황 전체 초기화';},4000); return; }
    state.progress={}; scheduleSave(); renderCounts(); renderSettings();
  };
  btns.append(ex,imp,cp,rs); btns.appendChild(fi);
  dc.appendChild(btns);
  const {core,cat}=counts();
  dc.appendChild(el('p','net-key','학습완료 합계: 코너 '+cat.c+'/378 · 엣지 '+cat.e+'/440 · 패리티 '+cat.p+'/21 · 플립 '+cat.f+'/11 · 트위스트 '+cat.t+'/14 — 총 '+(cat.c+cat.e+cat.p+cat.f+cat.t)+'/864'));
  wrap.appendChild(dc);

  main.appendChild(wrap);
}

/* ---------------- view toggle & filter ---------------- */
$('#viewSeg').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  ui.view=b.dataset.v;
  try{localStorage.setItem(LS_UI,JSON.stringify(ui));}catch(e2){}
  for(const x of $('#viewSeg').children) x.setAttribute('aria-pressed', x===b?'true':'false');
  renderMain();
});
function syncViewSeg(){
  for(const x of $('#viewSeg').children) x.setAttribute('aria-pressed', x.dataset.v===(ui.view||'list')?'true':'false');
  for(const x of $('#revSeg').children) x.setAttribute('aria-pressed', (x.dataset.r==='on')===!!state.showRev?'true':'false');
}
$('#revSeg').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  state.showRev = b.dataset.r==='on';
  scheduleSave(); syncViewSeg(); renderMain();
});
$('#filterSeg').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  ui.filter=b.dataset.f;
  try{localStorage.setItem(LS_UI,JSON.stringify(ui));}catch(e2){}
  for(const x of $('#filterSeg').children) x.setAttribute('aria-pressed', x===b?'true':'false');
  renderMain();
});
$('#arrowSeg').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  ui.arrows=b.dataset.a;
  try{localStorage.setItem(LS_UI,JSON.stringify(ui));}catch(e2){}
  syncArrowSeg(); drawArrows();
});
function syncArrowSeg(){
  for(const x of $('#arrowSeg').children) x.setAttribute('aria-pressed', x.dataset.a===(ui.arrows||'hover')?'true':'false');
}
function syncFilterSeg(){
  syncArrowSeg();
  for(const x of $('#filterSeg').children) x.setAttribute('aria-pressed', x.dataset.f===ui.filter?'true':'false');
}

/* ---------------- main render ---------------- */
function renderMain(){
  const mat = (ui.tab==='c'||ui.tab==='e') && ui.view==='matrix';
  $('#main').classList.toggle('wide', mat);
  if(ui.tab==='c'||ui.tab==='e'){ (mat?renderMatrix:renderPairs)(ui.tab); }
  else if(ui.tab==='s') renderSettings();
  else renderList(ui.tab);
}

/* ---------------- boot ---------------- */
async function boot(){
  const local=lsLoad();
  if(local) state=local;
  renderTabs(); syncFilterSeg(); syncViewSeg(); renderCounts(); renderMain();

  const seed=await remoteLoad();
  if(seed && (!local || seed.updatedAt>local.updatedAt)){
    state=seed; lsSave();
    renderCounts(); renderMain();
    showSaved('씨앗 진행상황 불러옴');
  }
}
window.addEventListener('resize', ()=>{ clearTimeout(drawArrows._t); drawArrows._t=setTimeout(drawArrows,150); });
document.addEventListener('mouseover', e=>{
  const t=e.target.closest ? e.target.closest('[data-key]') : null;
  const k=t ? t.dataset.key : null;
  if(k===hoverKey) return;
  document.querySelectorAll('.hov').forEach(x=>x.classList.remove('hov'));
  hoverKey=k; if(t) t.classList.add('hov');
  if(ui.arrows==='hover') drawArrows(); else if(ui.arrows==='all') updateFocus();
});
boot();
})();
</script>
